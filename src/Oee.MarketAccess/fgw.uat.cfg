[DEFAULT]
ConnectionType=acceptor
BeginString=FIX.4.4
DataDictionary=FIX44.xml
FileStorePath=./persist/store
FileLogPath=./persist/log

# Sequence reset
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N

# Daily session window
StartTime=09:00:00
EndTime=15:00:00
#NonStopSession=Y

# Hearbeat interval in seconds
HeartBtInt=30

# Timestamps at microsecond precision
TimestampPrecision=Microseconds

# TCP tuning - disable Nagle for lower latency
SocketNodelay=Y

# Enforce strict message validation
ValidateLengthAndChecksum=Y
ValidateFieldsOutOfOrder=Y
ValidateFieldsHaveValues=Y
UseDataDictionary=Y

# Logging
ScreenLogShowIncoming=Y
ScreenLogShowOutgoing=Y
ScreenLogShowEvents=Y
RedactFieldsInLogs=554

[SESSION]
SenderCompID=OEE_MAL
TargetCompID=TEST_CLIENT_A
SocketAcceptPort=5001

[SESSION]
SenderCompID=OEE_MAL
TargetCompID=TEST_CLIENT_B
SocketAcceptPort=5001